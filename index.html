<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ثبت درآمد</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Tahoma,sans-serif}
body{background:#0d0d17;color:#eee;padding:16px;min-height:100vh}
.container{max-width:500px;margin:0 auto}

.total-card{
  background:linear-gradient(135deg,#6366f1,#a855f7);
  border-radius:20px;
  padding:28px;
  text-align:center;
  margin-bottom:18px;
  position:relative;
  overflow:hidden;
}
.total-card::before{
  content:'';
  position:absolute;
  top:-50%;right:-50%;
  width:200%;height:200%;
  background:radial-gradient(circle,rgba(255,255,255,0.15),transparent 60%);
}
.total-card .label{font-size:13px;opacity:0.9;margin-bottom:8px;position:relative}
.total-card .amount{font-size:2.2rem;font-weight:bold;position:relative;letter-spacing:-1px}
.total-card .unit{font-size:12px;opacity:0.8;margin-top:6px;position:relative}

.stats{display:flex;gap:10px;margin-bottom:18px}
.stat{
  flex:1;background:#16162a;
  border-radius:14px;padding:14px;
  text-align:center;border:1px solid #25253f;
}
.stat .n{font-size:1.1rem;color:#a855f7;font-weight:bold}
.stat .l{font-size:10px;color:#666;margin-top:4px}

.card{
  background:#16162a;
  border-radius:18px;
  padding:20px;
  margin-bottom:16px;
  border:1px solid #25253f;
}
.card h3{font-size:14px;color:#a855f7;margin-bottom:14px;font-weight:bold}

input,select{
  width:100%;
  padding:14px;
  margin:6px 0;
  border-radius:12px;
  border:1px solid #25253f;
  background:#0d0d17;
  color:#eee;
  font-size:15px;
  font-family:inherit;
  outline:none;
  transition:0.2s;
}
input:focus,select:focus{border-color:#a855f7;box-shadow:0 0 0 3px rgba(168,85,247,0.15)}
input::placeholder{color:#555}
select option{background:#16162a}

button{
  width:100%;
  padding:14px;
  margin:6px 0;
  border-radius:12px;
  border:none;
  background:linear-gradient(135deg,#6366f1,#a855f7);
  color:#fff;
  font-weight:bold;
  cursor:pointer;
  min-height:48px;
  font-size:15px;
  font-family:inherit;
  transition:0.2s;
}
button:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(168,85,247,0.35)}
button:active{transform:translateY(0)}

.item{
  background:#16162a;
  border-radius:14px;
  padding:14px;
  margin:8px 0;
  border:1px solid #25253f;
  display:flex;
  justify-content:space-between;
  align-items:center;
  transition:0.2s;
}
.item:hover{border-color:#a855f7}
.item .info{flex:1}
.item .amount{color:#4ade80;font-weight:bold;font-size:1.05rem}
.item .date{font-size:11px;color:#666;margin-top:4px}
.item .note{font-size:11px;color:#888;margin-top:2px;font-style:italic}
.item .actions{display:flex;gap:6px}
.item .btn-icon{
  width:34px;height:34px;
  border-radius:10px;
  border:none;
  cursor:pointer;
  font-size:13px;
  margin:0;padding:0;
  min-height:34px;
  display:flex;align-items:center;justify-content:center;
  transition:0.2s;
}
.item .edit{background:rgba(99,102,241,0.15);color:#818cf8;border:1px solid rgba(99,102,241,0.3)}
.item .edit:hover{background:#6366f1;color:#fff}
.item .del{background:rgba(239,68,68,0.15);color:#f87171;border:1px solid rgba(239,68,68,0.3)}
.item .del:hover{background:#ef4444;color:#fff}

.empty{text-align:center;color:#555;padding:40px 20px;font-size:13px}

.modal{
  display:none;
  position:fixed;
  top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,0.8);
  backdrop-filter:blur(8px);
  z-index:100;
  align-items:center;
  justify-content:center;
  padding:16px;
}
.modal.show{display:flex}
.modal-content{
  background:#16162a;
  border-radius:20px;
  padding:24px;
  width:100%;
  max-width:400px;
  border:1px solid #25253f;
}
.modal-content h3{color:#a855f7;margin-bottom:16px;font-size:16px}
.modal-buttons{display:flex;gap:8px;margin-top:12px}
.modal-buttons button{margin:0}
.btn-cancel{background:#25253f !important;color:#fff !important}
.btn-cancel:hover{background:#333 !important;box-shadow:none !important}

.date-row{display:flex;gap:6px;margin:6px 0}
.date-row select{flex:1;margin:0}

.creator{
  text-align:center;color:#555;
  font-size:11px;padding:20px;
}
.creator .name{color:#a855f7;font-weight:bold;margin-top:4px}
.creator .phone{direction:ltr;display:inline-block;margin-top:4px}
</style>
</head>
<body>
<div class="container">

<div class="total-card">
  <div class="label">جمع درآمد ۳۰ روز اخیر</div>
  <div class="amount" id="total">0</div>
  <div class="unit">ریال</div>
</div>

<div class="stats">
  <div class="stat"><div class="n" id="count">0</div><div class="l">تعداد ثبت</div></div>
  <div class="stat"><div class="n" id="avg">0</div><div class="l">میانگین روزانه</div></div>
  <div class="stat"><div class="n" id="days">0</div><div class="l">روز با درآمد</div></div>
</div>

<div class="card">
  <h3>➕ ثبت درآمد جدید</h3>
  <input type="number" id="amount" placeholder="مبلغ (ریال)" min="0">
  <input type="text" id="note" placeholder="توضیحات (اختیاری)">
  <button onclick="addIncome()">ثبت کن</button>
</div>

<div class="card">
  <h3>📋 لیست درآمدها</h3>
  <div id="list"></div>
</div>

<div class="creator">
  ساخته شده توسط <span class="name">Mohammed</span><br>
  <span class="phone">0916 90 444 53</span>
</div>

</div>

<div class="modal" id="editModal">
  <div class="modal-content">
    <h3>✏️ ویرایش درآمد</h3>
    <input type="number" id="editAmount" placeholder="مبلغ (ریال)">
    <input type="text" id="editNote" placeholder="توضیحات">
    
    <div class="date-row">
      <select id="editDay"></select>
      <select id="editMonth">
        <option value="1">فروردین</option><option value="2">اردیبهشت</option>
        <option value="3">خرداد</option><option value="4">تیر</option>
        <option value="5">مرداد</option><option value="6">شهریور</option>
        <option value="7">مهر</option><option value="8">آبان</option>
        <option value="9">آذر</option><option value="10">دی</option>
        <option value="11">بهمن</option><option value="12">اسفند</option>
      </select>
      <select id="editYear"></select>
    </div>
    
    <div class="modal-buttons">
      <button onclick="saveEdit()">💾 ذخیره</button>
      <button onclick="closeEdit()" class="btn-cancel">انصراف</button>
    </div>
  </div>
</div>

<script>
const KEY = 'income_data';
let data = JSON.parse(localStorage.getItem(KEY) || '[]');
let editingId = null;

function toJalali(gy, gm, gd) {
  const g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
  let jy = (gy <= 1600) ? 0 : 979;
  gy -= (gy <= 1600) ? 621 : 1600;
  const gy2 = (gm > 2) ? (gy + 1) : gy;
  let days = (365*gy) + Math.floor((gy2+3)/4) - Math.floor((gy2+99)/100) + Math.floor((gy2+399)/400) - 80 + gd + g_d_m[gm-1];
  jy += 33*Math.floor(days/12053);
  days %= 12053;
  jy += 4*Math.floor(days/1461);
  days %= 1461;
  if (days > 365) { jy += Math.floor((days-1)/365); days = (days-1)%365; }
  const jm = (days < 186) ? 1+Math.floor(days/31) : 7+Math.floor((days-186)/30);
  const jd = 1 + ((days < 186) ? (days%31) : ((days-186)%30));
  return {jy, jm, jd};
}

function todayStr() {
  const n = new Date();
  const j = toJalali(n.getFullYear(), n.getMonth()+1, n.getDate());
  return j.jy + '/' + String(j.jm).padStart(2,'0') + '/' + String(j.jd).padStart(2,'0');
}

function fmt(n) { return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function save() { localStorage.setItem(KEY, JSON.stringify(data)); }

function getLast30Days() {
  const now = new Date();
  const thirtyDaysAgo = new Date(now.getTime() - (30 * 24 * 60 * 60 * 1000));
  return data.filter(item => {
    if (!item.timestamp) return false;
    return item.timestamp >= thirtyDaysAgo.getTime();
  });
}

function addIncome() {
  const amount = parseInt(document.getElementById('amount').value) || 0;
  const note = document.getElementById('note').value.trim();
  if (amount <= 0) return alert('⚠️ مبلغ معتبر وارد کن!');
  data.push({
    id: Date.now(),
    amount: amount,
    note: note,
    date: todayStr(),
    timestamp: Date.now()
  });
  save();
  render();
  document.getElementById('amount').value = '';
  document.getElementById('note').value = '';
}

function initEditDateSelectors() {
  const yearSel = document.getElementById('editYear');
  const daySel = document.getElementById('editDay');
  const now = new Date();
  const t = toJalali(now.getFullYear(), now.getMonth()+1, now.getDate());
  
  if (yearSel.options.length === 0) {
    for (let y = t.jy-5; y <= t.jy+2; y++) {
      const o = document.createElement('option');
      o.value = y; o.textContent = y;
      yearSel.appendChild(o);
    }
  }
  
  if (daySel.options.length === 0) {
    for (let d = 1; d <= 31; d++) {
      const o = document.createElement('option');
      o.value = d; o.textContent = d;
      daySel.appendChild(o);
    }
  }
}

function openEdit(id) {
  const item = data.find(x => x.id === id);
  if (!item) return;
  
  initEditDateSelectors();
  editingId = id;
  
  document.getElementById('editAmount').value = item.amount;
  document.getElementById('editNote').value = item.note || '';
  
  const parts = item.date.split('/');
  document.getElementById('editYear').value = parseInt(parts[0]);
  document.getElementById('editMonth').value = parseInt(parts[1]);
  document.getElementById('editDay').value = parseInt(parts[2]);
  
  document.getElementById('editModal').classList.add('show');
}

function saveEdit() {
  const amount = parseInt(document.getElementById('editAmount').value) || 0;
  const note = document.getElementById('editNote').value.trim();
  const y = document.getElementById('editYear').value;
  const m = document.getElementById('editMonth').value;
  const d = document.getElementById('editDay').value;
  
  if (amount <= 0) return alert('⚠️ مبلغ معتبر وارد کن!');
  
  const item = data.find(x => x.id === editingId);
  if (item) {
    item.amount = amount;
    item.note = note;
    item.date = y + '/' + String(m).padStart(2,'0') + '/' + String(d).padStart(2,'0');
    item.timestamp = Date.now();
    save();
    render();
  }
  closeEdit();
}

function closeEdit() {
  document.getElementById('editModal').classList.remove('show');
  editingId = null;
}

function del(id) {
  if (!confirm('🗑️ حذف شود؟')) return;
  data = data.filter(x => x.id !== id);
  save();
  render();
}

function render() {
  const sorted = [...data].sort((a, b) => b.timestamp - a.timestamp);
  const list = document.getElementById('list');
  
  if (!sorted.length) {
    list.innerHTML = '<div class="empty">📭 هنوز درآمدی ثبت نشده</div>';
  } else {
    list.innerHTML = '';
    sorted.forEach(item => {
      const div = document.createElement('div');
      div.className = 'item';
      div.innerHTML = `
        <div class="info">
          <div class="amount">💰 ${fmt(item.amount)} ریال</div>
          <div class="date">📅 ${item.date}</div>
          ${item.note ? `<div class="note">"${item.note}"</div>` : ''}
        </div>
        <div class="actions">
          <button class="btn-icon edit" onclick="openEdit(${item.id})">✏️</button>
          <button class="btn-icon del" onclick="del(${item.id})">✕</button>
        </div>
      `;
      list.appendChild(div);
    });
  }
  
  const last30 = getLast30Days();
  const total = last30.reduce((s, x) => s + x.amount, 0);
  const count = last30.length;
  const uniqueDays = new Set(last30.map(x => x.date)).size;
  const avg = uniqueDays > 0 ? Math.round(total / 30) : 0;
  
  document.getElementById('total').textContent = fmt(total);
  document.getElementById('count').textContent = count;
  document.getElementById('avg').textContent = fmt(avg);
  document.getElementById('days').textContent = uniqueDays;
}

document.getElementById('editModal').addEventListener('click', function(e) {
  if (e.target === this) closeEdit();
});

render();
</script>
</body>
</html>
